<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caruá Móveis | Móveis de Vime Sob Medida e Alta Qualidade em Cuiabá</title>
    <meta name="description" content="Móveis de vime artesanais e de alta durabilidade para áreas internas e externas. Atendimento sob medida em Cuiabá - MT. Solicite seu orçamento via WhatsApp!">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* RESET & CSS VARIABLES */
        :root {
            --primary: #8C532B;
            --primary-hover: #734220;
            --primary-light: #F9F5F0;
            --secondary: #2C3E35;
            --whatsapp: #25D366;
            --whatsapp-hover: #20BA5C;
            --dark: #1A1A1A;
            --slate: #4A5568;
            --light-bg: #FAF8F5;
            --white: #FFFFFF;
            --border: #E8E2D9;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 24px -6px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* BUTTONS & UI COMPONENTS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-align: center;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: var(--white);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.4);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: 0 8px 20px rgba(140, 83, 43, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--white);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--secondary);
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 60px auto;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .section-header p {
            color: var(--slate);
            font-size: 1.125rem;
        }

        /* HEADER / NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(250, 248, 245, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(232, 226, 217, 0.5);
            transition: var(--transition);
        }

        .navbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.03em;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background-color: var(--primary);
            color: var(--white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--dark);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--dark);
            cursor: pointer;
        }

        /* HERO SECTION */
        .hero {
            padding: 160px 0 100px 0;
            position: relative;
            background: linear-gradient(180deg, rgba(249, 245, 240, 0.6) 0%, var(--light-bg) 100%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: var(--dark);
            margin: 20px 0;
        }

        .hero-text h1 span {
            color: var(--primary);
            position: relative;
            display: inline-block;
        }

        .hero-text p {
            font-size: 1.2rem;
            color: var(--slate);
            margin-bottom: 32px;
            max-width: 540px;
        }

        .hero-ctas {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 40px;
        }

        .social-proof-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--white);
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            width: fit-content;
        }

        .stars {
            color: #FFB800;
            display: flex;
            gap: 2px;
        }

        .rating-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark);
        }

        .hero-image-wrapper {
            position: relative;
        }

        .hero-card-img {
            width: 100%;
            height: 520px;
            object-fit: cover;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .hero-glass-badge {
            position: absolute;
            bottom: -20px;
            left: -20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 280px;
        }

        .hero-glass-badge .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* SERVICES / CATALOG SECTION */
        .services {
            padding: 100px 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 32px;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .service-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .service-card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--dark);
        }

        .service-card p {
            color: var(--slate);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .service-link {
            font-weight: 700;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        /* DIFFERENTIALS SECTION */
        .differentials {
            padding: 100px 0;
            background-color: var(--secondary);
            color: var(--white);
            border-radius: 32px;
            margin: 40px 0;
            position: relative;
            overflow: hidden;
        }

        .differentials .section-header h2,
        .differentials .section-header p {
            color: var(--white);
        }

        .differentials .section-header p {
            opacity: 0.8;
        }

        .diff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 32px;
        }

        .diff-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
        }

        .diff-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-light);
            opacity: 0.4;
            margin-bottom: 12px;
            line-height: 1;
        }

        .diff-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .diff-card p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
        }

        /* TESTIMONIALS SECTION */
        .testimonials {
            padding: 100px 0;
        }

        .testimonial-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            position: relative;
        }

        .testimonial-quote {
            font-size: 1.25rem;
            color: var(--dark);
            font-style: italic;
            margin: 20px 0;
            line-height: 1.7;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .author-info h4 {
            font-weight: 700;
            color: var(--dark);
            text-align: left;
        }

        .author-info p {
            font-size: 0.85rem;
            color: var(--slate);
            text-align: left;
        }

        /* LOCATION & MAP SECTION */
        .location {
            padding: 100px 0;
            background: var(--white);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .location-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .location-info h2 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .address-box {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin: 24px 0 32px 0;
            padding: 20px;
            background: var(--light-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .address-box svg {
            color: var(--primary);
            flex-shrink: 0;
            margin-top: 4px;
        }

        .map-wrapper {
            width: 100%;
            height: 380px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* FAQ SECTION */
        .faq {
            padding: 100px 0;
        }

        .faq-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .faq-item {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .faq-question {
            width: 100%;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark);
            text-align: left;
            cursor: pointer;
        }

        .faq-icon {
            width: 24px;
            height: 24px;
            transition: var(--transition);
            color: var(--primary);
            flex-shrink: 0;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
            padding: 0 24px;
            color: var(--slate);
            font-size: 1rem;
        }

        .faq-item.active {
            border-color: var(--primary);
        }

        .faq-item.active .faq-icon {
            transform: rotate(180deg);
        }

        .faq-item.active .faq-answer {
            max-height: 1000px;
            padding: 0 24px 24px 24px;
            transition: max-height 0.3s cubic-bezier(1, 0, 1, 0);
        }

        /* FINAL CTA SECTION */
        .cta-final {
            padding: 100px 0;
            background: linear-gradient(135deg, var(--primary) 0%, #683A1B 100%);
            color: var(--white);
            text-align: center;
            border-radius: 32px;
            margin-bottom: 80px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .cta-final h2 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .cta-final p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 36px auto;
            opacity: 0.9;
        }

        /* FOOTER */
        footer {
            background-color: var(--dark);
            color: rgba(255, 255, 255, 0.7);
            padding: 60px 0 30px 0;
            font-size: 0.95rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-brand h3 {
            color: var(--white);
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .footer-brand p {
            max-width: 320px;
            line-height: 1.6;
        }

        .footer-links h4 {
            color: var(--white);
            font-size: 1.1rem;
            margin-bottom: 16px;
        }

        .footer-links ul li {
            margin-bottom: 10px;
        }

        .footer-links ul li a:hover {
            color: var(--white);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
            text-align: center;
            font-size: 0.875rem;
        }

        /* FLOATING WHATSAPP BUTTON */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            background-color: var(--whatsapp);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
            z-index: 999;
            transition: var(--transition);
            animation: pulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: var(--whatsapp-hover);
        }

        .whatsapp-float svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 992px) {
            .hero-grid, .location-grid {
                grid-template-columns: 1fr;
                gap: 40px
